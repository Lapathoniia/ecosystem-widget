<!doctype html>
<html lang="uk">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lapathoniia Ecosystem Widget Demo</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #eef4f2;
        color: #071316;
        font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      main {
        width: min(720px, calc(100vw - 32px));
      }

      lapathoniia-ecosystem-widget {
        --lapathoniia-widget-max-width: 520px;
        --lapathoniia-widget-bg: #071316;
        --lapathoniia-widget-accent: #8bdbe7;
        --lapathoniia-widget-radius: 14px;
      }
    </style>
  </head>
  <body>
    <main>
      <lapathoniia-ecosystem-widget lang="uk" limit="3"></lapathoniia-ecosystem-widget>
    </main>
    <script async src="/widgets/ecosystem/v1/widget.js"></script>
  </body>
</html>
